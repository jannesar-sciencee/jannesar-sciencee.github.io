name: One-shot safe hero rename
on:
  push:
    paths:
      - '.github/workflows/one-shot-rename-hero.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename hero and update only image references
        shell: bash
        run: |
          set -euo pipefail
          NEW='hossein-attar-jannesar-nobari.jpg'
          test -f hero.jpg
          test ! -e "$NEW"
          count=$(grep -RIl --exclude-dir=.git --exclude='one-shot-rename-hero.yml' 'hero\.jpg' articles/000 | wc -l)
          test "$count" -eq 260
          mv hero.jpg "$NEW"
          grep -RIl --exclude-dir=.git --exclude='one-shot-rename-hero.yml' 'hero\.jpg' . | while IFS= read -r f; do
            sed -i 's#hero\.jpg#hossein-attar-jannesar-nobari.jpg#g' "$f"
          done
          test -f "$NEW"
          test ! -e hero.jpg
          if grep -RIn --exclude-dir=.git --exclude='one-shot-rename-hero.yml' 'hero\.jpg' .; then
            echo 'ERROR: old hero.jpg reference remains'
            exit 1
          fi
          article_refs=$(grep -RIl 'hossein-attar-jannesar-nobari\.jpg' articles/000 | wc -l)
          test "$article_refs" -eq 260
          git diff --check
      - name: Commit rename and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-rename-hero.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rename hero image and update all references'
          git push
