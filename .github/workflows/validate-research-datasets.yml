name: Validate research metadata datasets
on:
  push:
    branches: [main]
    paths:
      - "datasets/**"
      - "scripts/validate-research-datasets.mjs"
      - "robots.txt"
      - "llms.txt"
      - "sitemap-datasets.xml"
      - ".github/workflows/validate-research-datasets.yml"
  pull_request:
    paths:
      - "datasets/**"
      - "scripts/validate-research-datasets.mjs"
      - "robots.txt"
      - "llms.txt"
      - "sitemap-datasets.xml"
      - ".github/workflows/validate-research-datasets.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify datasets, schema metadata and discovery files
        run: node scripts/validate-research-datasets.mjs
