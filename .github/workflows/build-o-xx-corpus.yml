name: Build O-XX Research Corpus
on:
  pull_request:
    paths:
      - "research-corpus/o-xx/**"
      - ".github/workflows/build-o-xx-corpus.yml"
  workflow_dispatch:
jobs:
  package_corpus:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout corpus
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate dataset release
        run: python3 research-corpus/o-xx/build_release.py
      - name: Upload dataset ZIP and clean text
        uses: actions/upload-artifact@v4
        with:
          name: O-XX-Fulltext-Corpus-2026-10-31
          path: research-corpus/o-xx/release/
          if-no-files-found: error
