name: Sync crawlable links
on:
  push:
    paths:
      - 'sitemap.xml'
      - 'assets/link-network.js'
      - '.github/workflows/sync-crawl-links.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static crawl links
        run: |
          python3 - <<'PY'
          import re, html, pathlib
          root=pathlib.Path('.')
          sm=(root/'sitemap.xml').read_text(encoding='utf-8')
          js=(root/'assets/link-network.js').read_text(encoding='utf-8')
          urls=re.findall(r'<loc>(https?://[^<]+)</loc>',sm)
          # Explicit external URLs already maintained in link-network.js
          urls += re.findall(r"https?://[^'\"\s)]+",js)
          # Expand Jantex/Janwood generated article URLs from the shared slug list.
          m=re.search(r"const\s+slugs\s*=\s*\[(.*?)\]",js,re.S)
          if m:
              slugs=re.findall(r"['\"]([^'\"]+)['\"]",m.group(1))
              for base in ('https://jantex110.github.io','https://janwood110.github.io'):
                  urls += [f'{base}/articles/{i:02d}-{slug}/' for i,slug in enumerate(slugs,1)]
          # Expand Blogfa posts 1..41 even if JS stores them procedurally.
          urls += [f'https://jannesar110.blogfa.com/post/{i}' for i in range(1,42)]
          # Stable de-duplication.
          seen=set(); clean=[]
          for u in urls:
              u=u.rstrip('.,;')
              if u not in seen:
                  seen.add(u); clean.append(u)
          block='<!-- STATIC-CRAWL-LINKS:START -->\n<section class="static-crawl-links" aria-label="فهرست کامل پیوندهای قابل خزش">\n' + ''.join(f'<a href="{html.escape(u,quote=True)}">{html.escape(u)}</a>\n' for u in clean) + '</section>\n<!-- STATIC-CRAWL-LINKS:END -->'
          for rel in ('index.html','articles/000/index.html','identity/index.html'):
              p=root/rel; s=p.read_text(encoding='utf-8')
              s=re.sub(r'<!-- STATIC-CRAWL-LINKS:START -->.*?<!-- STATIC-CRAWL-LINKS:END -->',block,s,flags=re.S)
              if 'STATIC-CRAWL-LINKS:START' not in s:
                  s=s.replace('</main>',block+'\n</main>')
              # Keep links visible/crawlable but visually unobtrusive.
              if '.static-crawl-links{' not in s:
                  s=s.replace('</head>','<style>.static-crawl-links{columns:2;column-gap:16px;margin-top:30px;opacity:.42}.static-crawl-links a{display:block;font-size:9px!important;line-height:1.35;margin:1px 0;overflow-wrap:anywhere}@media(max-width:700px){.static-crawl-links{columns:2}.static-crawl-links a{font-size:8px!important}}</style></head>')
              p.write_text(s,encoding='utf-8')
          print('Unique crawlable URLs:',len(clean))
          PY
      - name: Commit synchronized HTML
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html articles/000/index.html identity/index.html
          git commit -m 'Sync all crawlable links into static HTML'
          git push
