name: One-shot ALT and Person update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only hero ALT and Person identity
        shell: python
        run: |
          from pathlib import Path
          import json,re

          names = [
            'حسین عطار جاننثار نوبری','حسین عطار جان‌نثار نوبری','حسین عطار جان نثار نوبری',
            'حسین جاننثار نوبری','حسین جان‌نثار نوبری','حسین جان نثار نوبری',
            'حسین عطار جاننثار','حسین عطار جان‌نثار','حسین جاننثار','حسین جان‌نثار',
            'Hossein Attar Jannesar Nobari','Hossein Attar Janesar Nobari','Hossein Attar Jan-Nesar Nobari',
            'Hossein Jannesar Nobari','Hossein Janesar Nobari','Hossein Jan-Nesar Nobari',
            'Hosein Jannesar Nobari','Hosein Janesar Nobari','Hossein Jannesar','Hossein Janesar',
            'حسین عطار جانثار نوبری','حسین عطار جان‌ثار نوبری','حسین عطار جان‌سار نوبری',
            'حسین عطار جان‌نسار نوبری','حسین عطار جانسار نوبری','حسین عطار جاننسار نوبری',
            'حسین جان‌سار','حسین جانسار','حسین جاننسار','حسین جان‌نسار','حسین جان نسار',
            'حسین عطار','حسین عطارجان','حسین عطار جان','حسین نوبری'
          ]
          assert len(names)==35 and len(set(names))==35

          files=sorted(Path('articles/000').glob('000*/index.html'))
          assert len(files)==260, f'Expected 260 articles, found {len(files)}'
          target='<img src="/hero.jpg" alt="">'
          changed=[]
          for idx,p in enumerate(files, start=1):
              original=p.read_text(encoding='utf-8')
              assert original.count(target)==1, f'Hero target mismatch: {p}'
              if idx <= 245:
                  alt=names[(idx-1)//7]
              elif idx <= 250:
                  alt='حسین جان‌نثار'
              elif idx <= 255:
                  alt='حسین جان نثار'
              else:
                  alt='حسین جاننثار'
              replacement=f'<img src="/hero.jpg" alt="{alt}">'
              updated=original.replace(target,replacement,1)
              # Safety: prove the only article change is the intended hero ALT.
              assert updated.replace(replacement,target,1)==original
              p.write_text(updated,encoding='utf-8')
              changed.append((p,alt))

          ident=Path('identity/index.html')
          original=ident.read_text(encoding='utf-8')
          marker='<script id="jannesar-person-identity" type="application/ld+json">'
          assert marker not in original, 'Person identity schema already exists; refusing duplicate insertion'
          person={
            '@context':'https://schema.org','@type':'Person',
            '@id':'https://jannesar-sciencee.github.io/identity/#person',
            'name':'حسین عطار جاننثار نوبری',
            'alternateName':names,
            'image':'https://jannesar-sciencee.github.io/hero.jpg',
            'url':'https://jannesar-sciencee.github.io/identity/'
          }
          block=marker+json.dumps(person,ensure_ascii=False,separators=(',',':'))+'</script>'
          assert original.count('</head>')==1
          updated=original.replace('</head>',block+'</head>',1)
          # Safety: identity change is exactly one inserted Person block.
          assert updated.replace(block,'',1)==original
          ident.write_text(updated,encoding='utf-8')

          # Final validation: 245 = 35x7, final 15 = 5/5/5.
          assert len(changed)==260
          for n in names:
              assert sum(1 for _,a in changed[:245] if a==n)==7
          assert [a for _,a in changed[245:250]]==['حسین جان‌نثار']*5
          assert [a for _,a in changed[250:255]]==['حسین جان نثار']*5
          assert [a for _,a in changed[255:260]]==['حسین جاننثار']*5
          print('Validated: 260 ALT changes + Person alternateName; no title/H1/content edits.')
      - name: Commit changes and remove this one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-alt-person.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/000 identity/index.html .github/workflows/one-shot-alt-person.yml
          git diff --cached --quiet && exit 1
          git commit -m "Set distributed hero ALT names and Person aliases"
          git push
